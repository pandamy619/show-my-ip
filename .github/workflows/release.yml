name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version and extract notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          python3 scripts/prepare_release.py "$TAG" > "$RUNNER_TEMP/release/notes.md"

      - name: Install SwiftLint
        run: command -v swiftlint || brew install swiftlint

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build DMG
        run: make release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/ShowMyIP.dmg build/ShowMyIP.dmg.sha256 \
            --draft \
            --verify-tag \
            --title "Show My IP ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/release/notes.md"
